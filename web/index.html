<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>띵 에이전트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 상단 바: 앱 이름 + 탭 + 자동 인식 + 최근 인식 기록 + 테마 전환 -->
  <header class="topbar">
    <div class="brand" title="띵 에이전트 — 띵타이쿤 가격 계산·정리 도구">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-text">띵 에이전트</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="메뉴">
      <button class="tab" role="tab" data-tab="cooking"><span aria-hidden="true">🍳</span> 요리</button>
      <button class="tab" role="tab" data-tab="craft"><span aria-hidden="true">🎨</span> 공예품</button>
      <button class="tab" role="tab" data-tab="inventory"><span aria-hidden="true">🧺</span> 보유 재료</button>
      <button class="tab" role="tab" data-tab="settings"><span aria-hidden="true">⚙️</span> 설정</button>
    </nav>
    <!-- 자동 인식 (exe 에서만 켜짐. 브라우저에서는 비활성 + "exe에서만 사용 가능") -->
    <div class="capture" id="capture">
      <label class="switch cap-switch" id="capSwitch"><input type="checkbox" id="capToggle" aria-label="자동 인식 켜기/끄기"><span>🎥 자동 인식</span></label>
      <span class="cap-status off" id="capStatus" role="status" aria-live="polite"><i class="dot" aria-hidden="true"></i><span class="cap-text">꺼짐</span></span>
      <button class="btn small" id="capReadNow" type="button" title="지금 화면의 아이템 툴팁을 한 번 읽기" hidden>지금 읽기</button>
    </div>
    <button class="icon-btn log-btn" id="logToggle" type="button" title="최근 인식 기록" aria-label="최근 인식 기록" aria-expanded="false" aria-controls="logDrawer">📋<span class="log-badge" id="logBadge" hidden></span></button>
    <button class="icon-btn" id="themeToggle" title="밝은/어두운 테마 전환" aria-label="테마 전환">◐</button>
  </header>

  <main id="main">
    <section class="tab-panel" id="panel-cooking" data-panel="cooking" role="tabpanel"></section>
    <section class="tab-panel" id="panel-craft" data-panel="craft" role="tabpanel"></section>
    <section class="tab-panel" id="panel-inventory" data-panel="inventory" role="tabpanel"></section>
    <section class="tab-panel" id="panel-settings" data-panel="settings" role="tabpanel"></section>
  </main>

  <!-- 최근 인식 기록 서랍 (오른쪽) -->
  <aside class="drawer" id="logDrawer" aria-label="최근 인식 기록" hidden>
    <div class="drawer-head">
      <h3>📋 최근 인식</h3>
      <div class="spacer"></div>
      <button class="btn small" id="logClear" type="button">비우기</button>
      <button class="icon-btn small" id="logClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="drawer-body" id="logList"></div>
  </aside>

  <!-- 가격 기록 팝오버 (📈 버튼) -->
  <div class="hist-pop" id="histPop" role="dialog" aria-label="가격 기록" hidden></div>

  <!-- 데모 모드 표시 (#demo) -->
  <div class="demo-banner" id="demoBanner" hidden>데모 모드 · 시뮬레이션 데이터 · 저장되지 않음</div>

  <!-- 불러오는 중 표시 (저장소 준비 전까지) -->
  <div class="loading" id="loading"><div class="spinner"></div><span>불러오는 중…</span></div>

  <!-- 확인/알림 대화상자 (window.confirm 대신 사용 — pywebview 에서도 동일하게 보이도록) -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn" id="modalCancel">취소</button>
        <button class="btn primary" id="modalOk">확인</button>
      </div>
    </div>
  </div>

  <!-- 짧은 알림 메시지 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 스크립트 순서 중요: 데이터 → 계산 → 인식 → 상태 → 저장소 → 앱 (모두 일반 스크립트, file:// 호환) -->
  <script src="js/data.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/recog.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
